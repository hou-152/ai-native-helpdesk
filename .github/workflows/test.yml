name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate seven Skill packs
        run: python3 tools/quick_validate.py
      - name: Scan six child runtimes
        run: python3 tools/security_scan.py
      - name: Run Node.js tests
        run: node --test
